name: CI

on:
  push:
    paths-ignore:
      - 'CHANGES*'
      - 'Doc/**'
      - 'appveyor.yml'
  pull_request:
    branches: master
    paths-ignore:
      - 'CHANGES*'
      - 'Doc/**'
      - 'appveyor.yml'

jobs:
  build:

    # continue-on-error: true
    runs-on: ${{ matrix.os || 'ubuntu-20.04' }}

    # By default, the name of the build is the language used and SWIG options, but matrix entries
    # can define the additional "desc" field with any additional information to include in the name.
    name: ${{ matrix.SWIGLANG || 'none' }}${{ matrix.PY3 }} ${{ matrix.ENGINE}} ${{ matrix.VER }} ${{ matrix.SWIG_FEATURES }} ${{ (matrix.compiler || 'gcc') }}${{ matrix.GCC }} ${{ matrix.desc }}

    strategy:
      matrix:
        include:
        - SWIGLANG: ""
          GCC: 11
        - SWIGLANG: ""
          compiler: clang
        # c++11 testing
#       - SWIGLANG: csharp
#         CPPSTD: c++11
        - SWIGLANG: go
          VER: '1.14'
          CPPSTD: c++11
          CSTD: gnu11
        - SWIGLANG: go
          VER: '1.15'
          CPPSTD: c++11
          CSTD: gnu11
        - SWIGLANG: go
          VER: '1.16'
          CPPSTD: c++11
          CSTD: gnu11
        - SWIGLANG: go
          VER: '1.17'
          CPPSTD: c++11
          CSTD: gnu11
        - SWIGLANG: go
          VER: '1.16'
          CPPSTD: c++11
          CSTD: gnu99
#       - SWIGLANG: java
#         CPPSTD: c++11
#       - SWIGLANG: javascript
#         ENGINE: node
#         VER: '14'
#         CPPSTD: c++11
#       - SWIGLANG: octave
#         CPPSTD: c++11
#       - SWIGLANG: perl5
#         CPPSTD: c++11
        - SWIGLANG: php
          CPPSTD: c++11
          CSTD: gnu11
          os: ubuntu-18.04
        - SWIGLANG: php
          CPPSTD: c++11
          os: ubuntu-18.04
        - SWIGLANG: php
          VER: '8.0'
          CPPSTD: c++11
          os: ubuntu-18.04
        - SWIGLANG: php
          VER: '7.4'
          CPPSTD: c++11
          os: ubuntu-18.04
#       - SWIGLANG: python
#         CPPSTD: c++11
#         PY3: 3
#       - SWIGLANG: r
#         CPPSTD: c++11
#       - SWIGLANG: ruby
#         CPPSTD: c++11
#       - SWIGLANG: tcl
#         CPPSTD: c++11
#       # c++14 testing
#       - SWIGLANG: csharp
#         CPPSTD: c++14
        - SWIGLANG: go
          VER: '1.16'
          CPPSTD: c++14
          CSTD: gnu11
#       - SWIGLANG: java
#         CPPSTD: c++14
#       - SWIGLANG: javascript
#         ENGINE: node
#         VER: '16'
#         CPPSTD: c++14
#       - SWIGLANG: octave
#         CPPSTD: c++14
#       - SWIGLANG: perl5
#         CPPSTD: c++14
        - SWIGLANG: php
          VER: '7.4'
          CPPSTD: c++14
          os: ubuntu-18.04
#       - SWIGLANG: python
#         CPPSTD: c++14
#         PY3: 3
#       - SWIGLANG: r
#         CPPSTD: c++14
#       - SWIGLANG: ruby
#         CPPSTD: c++14
#       - SWIGLANG: tcl
#         CPPSTD: c++14
#       # c++17 testing
#       - SWIGLANG: csharp
#         CPPSTD: c++17
#         GCC: 11
        - SWIGLANG: go
          VER: '1.16'
          CPPSTD: c++17
          GCC: 11
#         CSTD: gnu17
#       - SWIGLANG: java
#         CPPSTD: c++17
#         GCC: 11
#       - SWIGLANG: javascript
#         ENGINE: node
#         VER: '16'
#         CPPSTD: c++17
#         GCC: 11
#       - SWIGLANG: octave
#         CPPSTD: c++17
#         GCC: 11
#       - SWIGLANG: perl5
#         CPPSTD: c++17
#         GCC: 11
        - SWIGLANG: php
          VER: '7.4'
          CPPSTD: c++17
          GCC: 11
          os: ubuntu-18.04
#       - SWIGLANG: python
#         CPPSTD: c++17
#         GCC: 11
#         PY3: 3
#       - SWIGLANG: r
#         CPPSTD: c++17
#         GCC: 11
#       - SWIGLANG: ruby
#         CPPSTD: c++17
#         GCC: 11
#       - SWIGLANG: tcl
#         CPPSTD: c++17
#         GCC: 11
        # let's run all of them, as opposed to aborting when one fails
      fail-fast: false

    env:
      SWIGLANG: ${{ matrix.SWIGLANG }}
      PY3: ${{ matrix.PY3 }}
      VER: ${{ matrix.VER }}
      ENGINE: ${{ matrix.ENGINE }}
      SWIG_FEATURES: ${{ matrix.SWIG_FEATURES }}
      CSTD: ${{ matrix.CSTD }}
      CPPSTD: ${{ matrix.CPPSTD }}
      GCC: ${{ matrix.GCC }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Install CCache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os || 'ubuntu-20.04' }}-${{ matrix.compiler || 'gcc' }}${{ matrix.GCC }}

    - name: Install Dependencies
      run: |
          set -x
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          echo PATH="$PATH" >> $GITHUB_ENV

          source $GITHUB_WORKSPACE/Tools/GHA-linux-install.sh
          echo WITHLANG="$WITHLANG" >> $GITHUB_ENV

          case $(uname) in
              Linux)
                  cpu_count=$(nproc)
                  ;;

              Darwin)
                  cpu_count=$(sysctl -n hw.ncpu)
                  ;;

              *)
                  cpu_count=1
                  ;;
          esac

          if [[ $cpu_count != 1 ]]; then
            echo SWIGJOBS=-j$cpu_count >> $GITHUB_ENV
          fi

          if test '${{ matrix.compiler }}' = 'clang'; then
            CC="clang"
            CXX="clang++"

            CFLAGS="$CFLAGS -fPIE"
            CXXFLAGS="$CXXFLAGS -fPIE"
          elif test -n "$GCC"; then
            CC="gcc-$GCC"
            CXX="g++-$GCC"
          else
            CC="gcc"
            CXX="g++"
          fi

          export CC CXX

          echo CC="$CC" >> $GITHUB_ENV
          echo CXX="$CXX" >> $GITHUB_ENV

          ls -la $(which $CC) $(which $CXX)
          $CC --version
          $CXX --version

    - name: Configure
      run: |
          source $GITHUB_WORKSPACE/Tools/CI-linux-environment.sh
          set -x

          if test -n '${{ matrix.CONFIGOPTS }}'; then
            CONFIGOPTS=${{ matrix.CONFIGOPTS }}
          fi
          if [[ -n "$CSTD" ]]; then
            case "$CPPSTD" in
              c++11) export CSTD=c11; CONFIGOPTS+=(--enable-cpp11-testing) ;;
              c++14) export CSTD=c11; CONFIGOPTS+=(--enable-cpp11-testing) ;;
              c++17) export CSTD=c17; CONFIGOPTS+=(--enable-cpp11-testing) ;;
            esac
          fi
          if test -n "$CPPSTD"; then CONFIGOPTS+=("CXXFLAGS=-std=$CPPSTD $CXXFLAGS"); fi
          if test -n "$CSTD"; then CONFIGOPTS+=("CFLAGS=-std=$CSTD $CFLAGS"); fi
          if test -n "$SWIGLANG"; then CONFIGOPTS+=(--without-alllang --with-$WITHLANG); fi
          echo "${CONFIGOPTS[@]}"
          ./autogen.sh && mkdir -p build/build && cd build/build && ../../configure "${CONFIGOPTS[@]}"

    - name: Build
      working-directory: build/build
      run: |
          set -x
          make -s $SWIGJOBS
          ./swig -version && ./swig -pcreversion

    - name: Test
      working-directory: build/build
      run: |
          source $GITHUB_WORKSPACE/Tools/CI-linux-environment.sh
          set -x

          if test -z "$SWIGLANG"; then make $SWIGJOBS check-ccache; fi
          if test -z "$SWIGLANG"; then make $SWIGJOBS check-errors-test-suite; fi

          case "$SWIGLANG" in
            javascript)
              case "$ENGINE" in
                v8 | jsc)
                  # Running tests using v8 or jsc involves creating a custom
                  # interpreter in Tools/javascript, which is currently broken
                  # for parallel builds (we attempt to update this interpreter
                  # while running, resulting in "Text file busy" error).
                  unset SWIGJOBS
              esac
              ;;
          esac

          # Stricter compile flags for examples. Various headers and SWIG generated code prevents full use of -pedantic.
          if test -n "$SWIGLANG"; then cflags=$($GITHUB_WORKSPACE/Tools/testflags.py --language $SWIGLANG --cflags --std=$CSTD --compiler=$CC) && echo $cflags; fi
          if test -n "$SWIGLANG"; then cxxflags=$($GITHUB_WORKSPACE/Tools/testflags.py --language $SWIGLANG --cxxflags --std=$CPPSTD --compiler=$CC) && echo $cxxflags; fi
          if test -n "$SWIGLANG"; then make check-$SWIGLANG-version; fi
          if test -n "$SWIGLANG"; then make check-$SWIGLANG-enabled; fi
          if test -n "$SWIGLANG"; then make $SWIGJOBS check-$SWIGLANG-examples CFLAGS="$cflags" CXXFLAGS="$cxxflags"; fi
          if test -n "$SWIGLANG"; then make $SWIGJOBS check-$SWIGLANG-test-suite CFLAGS="$cflags" CXXFLAGS="$cxxflags"; fi

    - name: Install
      working-directory: build/build
      run: |
          set -x
          if test -z "$SWIGLANG"; then sudo make install && swig -version && ccache-swig -V; fi

    - name: Clean
      working-directory: build/build
      run: |
          set -x
          make check-maintainer-clean && ../../configure $CONFIGOPTS
